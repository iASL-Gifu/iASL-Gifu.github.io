<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | iASL</title>
    <link rel="icon" href="/img/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/component/style/members_list.css">
</head>
<body class="members-list-page">
    <div id="background-animation"></div>
    <div class="container" id="member-list-container">
        <h1 class="page-title">Members</h1>
        <p id="loading-message" class="loading-message">メンバーリストを読み込んでいます...</p>
    </div>

    <button class="logo logo-button" type="button" onclick="goBackOrRedirect()" aria-label="戻る"><i class="fa fa-circle-left" aria-hidden="true"></i></button>

    <script src="/hook/members_list_script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const backgroundAnimation = document.getElementById('background-animation');
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            const iconImages = [
                '/img/logo_clear.png',
                '/img/pix2.png',
                '/img/calypso_b.png',
                '/img/robot_b.png',
                '/img/saku-logo.png'
            ];

            function createIcon() {
                if (!backgroundAnimation || prefersReducedMotion.matches || document.hidden || backgroundAnimation.childElementCount > 6) {
                    return;
                }

                const icon = document.createElement('img');
                const size = Math.random() * 56 + 42;
                const duration = Math.random() * 12 + 16;

                icon.classList.add('floating-icon');
                icon.src = iconImages[Math.floor(Math.random() * iconImages.length)];
                icon.alt = '';
                icon.style.width = `${size}px`;
                icon.style.height = 'auto';
                icon.style.left = `${Math.random() * 100}vw`;
                icon.style.animationDuration = `${duration}s`;
                icon.style.animationDelay = `${Math.random() * 1.5}s`;

                backgroundAnimation.appendChild(icon);

                setTimeout(() => {
                    icon.remove();
                }, duration * 1000 + 1800);
            }

            createIcon();
            createIcon();
            setInterval(createIcon, 4200);
        });
    </script>
</body>
</html>
